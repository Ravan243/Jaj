<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>🎤 Угадай Кто Говорит</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f2f2f2;
    }
    .hidden {
      display: none;
    }
    .section {
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="section">
    <h2>👋 Вход в игру</h2>
    <label>Введите ваше имя:
      <input type="text" id="playerName">
    </label>
    <button onclick="enterGame()">Войти</button>
  </div>

  <div id="gameSection" class="section hidden">
    <h2>🎙️ Запись голоса</h2>
    <button id="recordBtn">Начать запись</button>
    <button id="playBtn" class="hidden">▶️ Проиграть</button>
    <button id="guessBtn" class="hidden">➡️ Передать другим</button>
    <br><br>
    <strong>Ты: <span id="yourName"></span></strong>
  </div>

  <div id="guessSection" class="section hidden">
    <h2>🤔 Кто это сказал?</h2>
    <button onclick="playGuessAudio()">🔊 Послушать</button><br><br>
    <label>Твоя догадка:
      <input type="text" id="guessInput">
    </label>
    <button onclick="makeGuess()">Проверить</button>
    <p id="resultText"></p>
  </div>

  <script>
    let mediaRecorder;
    let audioBlob;
    let audioURL;
    let realSpeakerName = '';
    let currentUser = '';

    function enterGame() {
      const nameInput = document.getElementById('playerName').value.trim();
      if (!nameInput) return alert('Введи своё имя!');
      currentUser = nameInput.toLowerCase();
      document.getElementById('yourName').innerText = currentUser;
      document.getElementById('gameSection').classList.remove('hidden');
    }

    const recordBtn = document.getElementById('recordBtn');
    const playBtn = document.getElementById('playBtn');
    const guessBtn = document.getElementById('guessBtn');

    recordBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      let chunks = [];

      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
        audioURL = URL.createObjectURL(audioBlob);
        playBtn.classList.remove('hidden');
        guessBtn.classList.remove('hidden');
        realSpeakerName = currentUser;
      };

      mediaRecorder.start();
      setTimeout(() => {
        mediaRecorder.stop();
        alert('⏹️ Запись завершена!');
      }, 3000); // 3 сек
    };

    playBtn.onclick = () => {
      const audio = new Audio(audioURL);
      audio.play();
    };

    guessBtn.onclick = () => {
      document.getElementById('guessSection').classList.remove('hidden');
    };

    function playGuessAudio() {
      const audio = new Audio(audioURL);
      audio.play();
    }

    function makeGuess() {
      const guess = document.getElementById('guessInput').value.trim().toLowerCase();
      const resultText = document.getElementById('resultText');

      if (guess === realSpeakerName) {
        let points = parseInt(localStorage.getItem(guess) || '0') + 1;
        localStorage.setItem(guess, points);
        resultText.innerText = `✅ Правильно! У ${guess} теперь ${points} балл(ов).`;
        if (points >= 5) {
          alert(`🎉 ${guess} победил!`);
        }
      } else {
        resultText.innerText = '❌ Неправильно. Попробуй снова.';
      }
    }
  </script>

</body>
</html>
