<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Səs Tapmaca Oyunu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f1f1f1;
      color: #222;
    }

    h2 {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    .box {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    input, button {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 8px;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #0077cc;
      color: white;
      cursor: pointer;
      transform: scale(1.05);
    }

    #scoreBoard td, #scoreBoard th {
      padding: 5px 10px;
    }

    #startBtn {
      background: #28a745;
      color: white;
    }

    #startBtn:hover {
      background: #218838;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎤 Səs Tapmaca Oyunu</h2>
    <p>Oyun qaydası: Biri səs yazır. Qalanlar təxmin edir ki, bu kimdir. Doğru təxmin edən xallar qazanır. İlk 5 xal qazanan qalib olur.</p>
  </div>

  <div class="box">
    <h3>👤 Adını daxil et:</h3>
    <input type="text" id="playerName" placeholder="Adınız">
    <button onclick="addPlayer()">Oyuna qoşul</button>
    <p id="playerCount"></p>
    <table id="scoreBoard" class="hidden">
      <thead>
        <tr><th>Oyunçu</th><th>Xal</th></tr>
      </thead>
      <tbody id="scoreBody"></tbody>
    </table>
    <button id="startBtn" class="hidden" onclick="startGame()">Oyuna Başla</button>
  </div>

  <div id="gameBox" class="box hidden">
    <h3 id="yourNameLabel"></h3>
    <button id="recordBtn">🎙️ Səsi yaz</button>
    <button id="playBtn" class="hidden">▶️ Dinlə</button>
    <button id="sendBtn" class="hidden">➡️ Təxmin etsinlər</button>
  </div>

  <div id="guessBox" class="box hidden">
    <h3>Bu səsi kim dedi?</h3>
    <button onclick="playGuessAudio()">🔊 Dinlə</button><br><br>
    <input type="text" id="guessInput" placeholder="Kim olduğunu təxmin et">
    <button onclick="makeGuess()">Göndər</button>
    <p id="guessResult"></p>
  </div>

  <script>
    let players = [];
    let currentUser = '';
    let mediaRecorder;
    let audioBlob;
    let audioURL;
    let realSpeaker = '';

    function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert('Adını yaz!');
      if (players.includes(name.toLowerCase())) return alert('Bu ad artıq var!');

      players.push(name.toLowerCase());
      localStorage.setItem(name.toLowerCase(), '0');
      updateScoreboard();
      document.getElementById('playerName').value = '';
    }

    function updateScoreboard() {
      const tbody = document.getElementById('scoreBody');
      tbody.innerHTML = '';
      players.forEach(name => {
        const score = localStorage.getItem(name) || '0';
        const row = `<tr><td>${name}</td><td>${score}</td></tr>`;
        tbody.innerHTML += row;
      });

      document.getElementById('playerCount').innerText = `Oyunçular: ${players.length}`;
      document.getElementById('scoreBoard').classList.remove('hidden');

      if (players.length >= 4) {
        document.getElementById('startBtn').classList.remove('hidden');
      }
    }

    function startGame() {
      const name = prompt('Bu raundda səsi kim yazacaq? (Ad yaz)');
      if (!players.includes(name.toLowerCase())) return alert('Belə bir oyunçu yoxdur!');
      currentUser = name.toLowerCase();
      document.getElementById('yourNameLabel').innerText = `Sən: ${currentUser}`;
      document.getElementById('gameBox').classList.remove('hidden');
    }

    document.getElementById('recordBtn').onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      let chunks = [];

      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
        audioURL = URL.createObjectURL(audioBlob);
        document.getElementById('playBtn').classList.remove('hidden');
        document.getElementById('sendBtn').classList.remove('hidden');
        realSpeaker = currentUser;
      };

      mediaRecorder.start();
      setTimeout(() => {
        mediaRecorder.stop();
        alert('⏹️ Yazı tamamlandı!');
      }, 3000);
    };

    document.getElementById('playBtn').onclick = () => {
      const audio = new Audio(audioURL);
      audio.play();
    };

    document.getElementById('sendBtn').onclick = () => {
      document.getElementById('guessBox').classList.remove('hidden');
    };

    function playGuessAudio() {
      const audio = new Audio(audioURL);
      audio.play();
    }

    function makeGuess() {
      const guess = document.getElementById('guessInput').value.trim().toLowerCase();
      const result = document.getElementById('guessResult');
      if (guess === realSpeaker) {
        let score = parseInt(localStorage.getItem(guess) || '0') + 1;
        localStorage.setItem(guess, score);
        updateScoreboard();
        result.innerText = `✅ Doğrudur! ${guess} - indi ${score} xal.`;
        if (score >= 5) {
          alert(`🎉 ${guess} qalib oldu!`);
        }
      } else {
        result.innerText = '❌ Səhvdir! Təkrar yoxla.';
      }
    }
  </script>
</body>
</html>
